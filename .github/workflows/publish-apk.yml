name: Publish the fork's Android release

on:
  push:
    branches: [master]
    paths:
      - 'downloads/*.apk'
      - '.github/scripts/publish_apk.py'
      - '.github/workflows/publish-apk.yml'
  workflow_dispatch:

jobs:
  publish:
    if: github.repository == 'seionwon/avnc' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: avnc-apk-release
      queue: max
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Publish the installer shown on the repository homepage
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/publish_apk.py
